name: Deploy and release WordPress plugin
on:
    push:
        tags:
            - '*'
permissions: {}
concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: false
jobs:
    deploy-release-plugin:
        name: New tag
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - name: Ensure the tag is merged into main
              run: |
                  git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                      echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main. Merge the release branch into main (merge commit, not squash) before tagging."
                      exit 1
                  fi
            - name: Build
              run: |
                  npm ci
                  npm run build
            - name: Deploy to WordPress.org SVN repository
              id: deploy
              uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
              with:
                  generate-zip: true
              env:
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
            - name: Create GitHub release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  files: ${{ github.workspace }}/${{ github.event.repository.name }}.zip
                  token: ${{ secrets.GITHUB_TOKEN }}
